<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpsDesk — interactive simulation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <h1>OpsDesk</h1>
        <p class="sim-note">Interactive simulation · fictional tickets only · no model, no server, no real actions</p>
      </div>
    </header>
    <div class="app-body">
      <aside id="queue" class="queue" aria-label="Ticket queue"></aside>
      <section id="content" class="detail" aria-live="polite"></section>
    </div>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
