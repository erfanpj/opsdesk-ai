<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpsDesk — interactive fixture simulation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="banner" role="status">
    <strong>Interactive fixture simulation</strong> — fictional tickets and handbook text only.
    No model, no server, no real customer actions. Browser storage holds per-ticket demo state; Reset this ticket restores that fixture only.
  </header>
  <main class="layout">
    <nav id="nav" class="toolbar" aria-label="Fixture tickets"></nav>
    <div id="content"></div>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
